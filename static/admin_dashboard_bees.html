        <script>
            const API_BASE_URL = '/api/v1';
            const notification = document.getElementById('notification');
            let apiKey = '';
            // Variable global para almacenar el estado actual de la cola
            let currentQueueData = { now_playing: null, upcoming: [] };

            // --- UTILS ---
            function showNotification(message, type = 'success', duration = 4000) {
                notification.textContent = message;
                notification.className = ''; // Limpiar clases previas
                notification.classList.add('show');
                notification.classList.add(type);
                setTimeout(() => {
                    notification.classList.remove('show');
                }, duration);
            }

            async function apiFetch(endpoint, options = {}) {
                const headers = { ...options.headers, 'Authorization': `Bearer ${apiKey}` };
                const activeLocalId = sessionStorage.getItem('active_local_id');
                if (activeLocalId) {
                    headers['X-Local-ID'] = activeLocalId;
                }
                if (options.body && !(options.body instanceof FormData)) {
                    headers['Content-Type'] = 'application/json';
                }
                options.headers = headers;
                const response = await fetch(`${API_BASE_URL}${endpoint}`, options);
                if (response.status === 204) return null; // No content

                let data;
                const text = await response.text();
                try {
                    data = text ? JSON.parse(text) : null;
                } catch (jsonErr) {
                    data = { detail: text || `Error HTTP ${response.status}` };
                }

                if (!response.ok) {
                    throw new Error((data && data.detail) || `Error ${response.status}`);
                }
                return data;
            }

            // Cargar pedidos en la barra superior fija
            async function loadTopOrdersBar() {
                try {
                    const topOrdersList = document.getElementById('top-orders-list');
                    if (!topOrdersList) return;

                    const pedidos = await apiFetch('/admin/recent-consumos?limit=25');

                    topOrdersList.innerHTML = '';

                    if (!pedidos || pedidos.length === 0) {
                        topOrdersList.innerHTML = '<div class="admin-orders-empty">📪 Sin pedidos pendientes</div>';
                        return;
                    }

                    // Agrupar por mesa
                    const pedidosPorMesa = pedidos.reduce((acc, pedido) => {
                        const mesaNombre = pedido.mesa_nombre || 'Sin mesa';
                        if (!acc[mesaNombre]) {
                            acc[mesaNombre] = {
                                items: [],
                                ultimaFecha: new Date(0),
                                nicks: new Set()
                            };
                        }
                        acc[mesaNombre].items.push(pedido);
                        acc[mesaNombre].nicks.add(pedido.usuario_nick);
                        if (new Date(pedido.created_at) > acc[mesaNombre].ultimaFecha) {
                            acc[mesaNombre].ultimaFecha = new Date(pedido.created_at);
                        }
                        return acc;
                    }, {});

                    // Crear items detallados para cada mesa
                    Object.keys(pedidosPorMesa)
                        .sort((a, b) => pedidosPorMesa[b].ultimaFecha - pedidosPorMesa[a].ultimaFecha)
                        .forEach(mesaNombre => {
                            const grupo = pedidosPorMesa[mesaNombre];
                            const div = document.createElement('div');
                            div.className = 'top-order-card';

                            const itemsHtml = grupo.items
                                .map(item => `<div class="top-order-item">
                                    <div class="top-order-controls">
                                        <button class="top-btn-qty btn-minus" data-id="${item.id}" title="Disminuir">-</button>
                                        <span class="top-order-quantity">${item.cantidad}x</span>
                                        <button class="top-btn-qty btn-plus" data-id="${item.id}" title="Aumentar">+</button>
                                    </div>
                                    <span class="top-order-product">${item.producto_nombre}</span>
                                    <button class="top-btn-delete-item" data-id="${item.id}" title="Eliminar producto">×</button>
                                </div>`)
                                .join('');

                            const allConsumoIds = grupo.items.map(item => item.id).join(',');

                            div.innerHTML = `
                                <div class="top-order-header">
                                    <span class="top-order-mesa">🔔 ${mesaNombre}</span>
                                    <span class="top-order-time">${grupo.ultimaFecha.toLocaleTimeString()}</span>
                                </div>
                                <div class="top-order-items-list">
                                    ${itemsHtml}
                                </div>
                                <div class="top-order-meta">
                                    Por: <strong>${[...grupo.nicks].join(', ')}</strong>
                                </div>
                                <div class="top-order-actions">
                                    <button class="top-btn-despachado" data-ids="${allConsumoIds}" title="Marcar todo como despachado">
                                        ✅ Despachado
                                    </button>
                                    <button class="top-btn-cancelar" data-ids="${allConsumoIds}" title="Cancelar todo el pedido">
                                        ❌ Cancelar
                                    </button>
                                </div>
                            `;

                            topOrdersList.appendChild(div);
                        });


                    // Actualizar visibilidad del icono de alerta
                    updateAlertIconVisibility();
                } catch (error) {
                    console.warn('Error cargando pedidos en barra superior:', error);
                }
            }

            // Configurar listeners de la barra superior (solo una vez)
            function setupTopOrdersListeners() {
                const topOrdersList = document.getElementById('top-orders-list');
                if (!topOrdersList) return;

                // Remover listeners previos si existieran (aunque al ser funcion init, se llama una vez)
                // Usamos una bandera en el elemento para asegurarnos
                if (topOrdersList.dataset.listenersAttached === 'true') return;
                topOrdersList.dataset.listenersAttached = 'true';

                topOrdersList.addEventListener('click', async (e) => {
                    const btnDespachado = e.target.closest('.top-btn-despachado');
                    const btnCancelar = e.target.closest('.top-btn-cancelar');
                    const btnPlus = e.target.closest('.btn-plus');
                    const btnMinus = e.target.closest('.btn-minus');
                    const btnDeleteItem = e.target.closest('.top-btn-delete-item');

                    // Evitar doble clic y acciones múltiples
                    const targetBtn = e.target.closest('button');
                    if (targetBtn) {
                        if (targetBtn.disabled) return; // Ya está deshabilitado
                        targetBtn.disabled = true;
                    }

                    let consumoIds;
                    let endpoint;
                    let confirmMessage;
                    let successMessage;
                    let method = 'POST';

                    try {
                        if (btnPlus) {
                            const id = btnPlus.dataset.id;
                            await apiFetch(`/admin/consumos/${id}/increase`, { method: 'POST' });
                            return;
                        } else if (btnMinus) {
                            const id = btnMinus.dataset.id;
                            await apiFetch(`/admin/consumos/${id}/decrease`, { method: 'POST' });
                            return;
                        } else if (btnDeleteItem) {
                            const id = btnDeleteItem.dataset.id;
                            if (!confirm("¿Eliminar este producto del pedido?")) {
                                if (targetBtn) targetBtn.disabled = false;
                                return;
                            }
                            await apiFetch(`/admin/consumos/${id}`, { method: 'DELETE' });
                            showNotification("Producto eliminado.", "success");
                            return;
                        } else if (btnDespachado) {
                            consumoIds = (btnDespachado.dataset.ids || '').split(',').filter(id => id);
                            endpoint = `/admin/consumos/{consumo_id}/mark-despachado`;
                            confirmMessage = '¿Confirmas que este pedido ha sido despachado?';
                            successMessage = 'Pedido marcado como despachado.';
                            method = 'POST';
                        } else if (btnCancelar) {
                            consumoIds = (btnCancelar.dataset.ids || '').split(',').filter(id => id);
                            endpoint = `/admin/consumos/{consumo_id}`;
                            confirmMessage = '¿Estás seguro de que quieres CANCELAR este pedido?';
                            successMessage = 'Pedido cancelado.';
                            method = 'DELETE';
                        } else {
                            if (targetBtn) targetBtn.disabled = false;
                            return;
                        }

                        if (!consumoIds || consumoIds.length === 0) {
                            if (targetBtn) targetBtn.disabled = false;
                            return;
                        }
                        if (!confirm(confirmMessage)) {
                            if (targetBtn) targetBtn.disabled = false;
                            return;
                        }

                        for (const id of consumoIds) {
                            const finalEndpoint = endpoint.replace('{consumo_id}', id);
                            await apiFetch(finalEndpoint, { method: method });
                        }

                        showNotification(successMessage, 'success');

                    } catch (error) {
                        console.error("Error procesando acción:", error);
                        // Si es 404, es probable que ya se haya eliminado/despachado en otra pestaña/usuario
                        if (error.message && error.message.includes("404")) {
                            showNotification("El pedido ya no existe o fue modificado.", "warning");
                        } else {
                            showNotification(error.message || "Error procesando acción", "error");
                        }
                    } finally {
                        if (targetBtn) targetBtn.disabled = false;
                        // SIEMPRE recargar la barra para asegurar consistencia
                        loadTopOrdersBar();
                    }
                });
            }

            // Toggle para colapsar/expandir la barra de pedidos
            function setupOrdersBarToggle() {
                const toggleBtn = document.getElementById('orders-toggle-btn');
                const ordersBar = document.querySelector('.admin-top-orders-bar');

                if (!toggleBtn || !ordersBar) return;

                // Cargar estado guardado del localStorage
                const isCollapsed = localStorage.getItem('ordersBarCollapsed') === 'true';
                if (isCollapsed) {
                    ordersBar.classList.add('collapsed');
                }

                toggleBtn.addEventListener('click', () => {
                    ordersBar.classList.toggle('collapsed');
                    const collapsed = ordersBar.classList.contains('collapsed');
                    localStorage.setItem('ordersBarCollapsed', collapsed);

                    // Update alert icon visibility
                    updateAlertIconVisibility();
                });
            }

            // NEW FUNCTION: Update Alert Icon Visibility
            function updateAlertIconVisibility() {
                const alertIcon = document.getElementById('pending-orders-alert');
                const ordersBar = document.querySelector('.admin-top-orders-bar');
                const topOrdersList = document.getElementById('top-orders-list');

                if (!alertIcon || !ordersBar || !topOrdersList) return;

                // Check if there are orders (simple check: if it doesn't have the empty message)
                const hasOrders = !topOrdersList.querySelector('.admin-orders-empty') && topOrdersList.children.length > 0;

                // Check if bar is collapsed
                const isCollapsed = ordersBar.classList.contains('collapsed');

                if (hasOrders && isCollapsed) {
                    alertIcon.classList.remove('hidden');
                } else {
                    alertIcon.classList.add('hidden');
                }
            }

            // NEW FUNCTION: Enviar actualización de cuenta a través de WebSocket
            function enviarActualizacionCuenta(mesaId, cuenta) {
                if (adminSocket && adminSocket.readyState === WebSocket.OPEN) {
                    const payload = {
                        type: 'update_account',
                        mesa_id: mesaId,
                        cuenta: cuenta
                    };
                    adminSocket.send(JSON.stringify(payload));
                } else {
                    console.warn("WebSocket no está conectado para enviar actualización de cuenta.");
                }
            }

            // --- AUTOPLAY UTILITIES (shared) ---
            async function handleToggleAutoplay(event) {
                // Toggle autoplay on the server (endpoint toggles state)
                try {
                    const result = await apiFetch('/admin/autoplay/toggle', { method: 'POST' });
                    const status = result && typeof result.autoplay_status !== 'undefined' ? result.autoplay_status : null;
                    if (status !== null) {
                        updateAutoplayStatus(status);
                        showNotification(`${status ? 'Activado' : 'Desactivado'}.`, 'info');
                    }
                } catch (err) {
                    showNotification(err.message || 'Error cambiando autoplay', 'error');
                }
            }

            function updateAutoplayStatus(enabled) {
                const el = document.getElementById('autoplay-toggle-queue');
                if (el) el.checked = !!enabled;
            }

            // startCarousel may be defined in player.html; provide a noop fallback for admin
            function startCarousel() {
                // noop for admin dashboard; player.html provides real implementation
                return;
            }
            // --- RENDER FUNCTIONS ---

            // Inventory rendering moved to `static/admin_pages/inventory.js` (renderProducts)

            // Queue rendering moved to `static/admin_pages/queue.js` (renderApprovedSongs)

            // API keys rendering moved to `static/admin_pages/settings.js` (render API keys)

            // Tables rendering moved to `static/admin_pages/tables.js` (renderTablesList)

            async function generateQrForTable(canvas, tableQrCode, tableId) {
                let url;
                if (tableQrCode && tableQrCode.startsWith('/')) {
                    url = `${window.location.origin}${tableQrCode}`;
                } else if (tableId && !isNaN(tableId)) {
                    try {
                        const localId = localStorage.getItem('selectedLocalId') || 1;
                        const res = await fetch(`/api/v1/mesas/generate-qr-key?mesa_id=${tableId}&local_id=${localId}&user_num=1`);
                        if (res.ok) {
                            const data = await res.json();
                            url = `${window.location.origin}/user?key=${encodeURIComponent(data.key)}`;
                        }
                    } catch (e) {}
                }
                
                if (!url) {
                    url = `${window.location.origin}/user?key=${tableQrCode}`;
                }

                QRCode.toCanvas(canvas, url, { width: 256, errorCorrectionLevel: 'H' }, function (error) {
                    if (error) {
                        console.error(error);
                        canvas.parentElement.innerHTML = '<p style="color: var(--error-color);">Error al generar el QR.</p>';
                    } else {
                        const urlElement = document.createElement('p');
                        urlElement.className = 'item-meta';
                        urlElement.style.wordBreak = 'break-all';
                        urlElement.textContent = url;
                        canvas.parentElement.appendChild(urlElement);
                    }
                });
            }

            async function showTableDetails(tableId, tableName, tableQrCode, isActive) {
                const container = document.getElementById('qr-code-container');
                container.innerHTML = '';

                const nameElement = document.createElement('p');
                nameElement.style.fontWeight = 'bold';
                nameElement.textContent = tableName;
                container.appendChild(nameElement);

                try {
                    let url;
                    if (tableQrCode && tableQrCode.startsWith('/')) {
                        url = `${window.location.origin}${tableQrCode}`;
                    } else if (tableId && !isNaN(tableId)) {
                        try {
                            const localId = localStorage.getItem('selectedLocalId') || 1;
                            const res = await fetch(`/api/v1/mesas/generate-qr-key?mesa_id=${tableId}&local_id=${localId}&user_num=1`);
                            if (res.ok) {
                                const data = await res.json();
                                url = `${window.location.origin}/user?key=${encodeURIComponent(data.key)}`;
                            }
                        } catch (e) {}
                    }
                    if (!url) {
                        url = `${window.location.origin}/user?key=${tableQrCode}`;
                    }

                    if (url) {
                        const urlWrap = document.createElement('div');
                        urlWrap.style.marginTop = '10px';
                        urlWrap.style.display = 'flex';
                        urlWrap.style.flexDirection = 'column';
                        urlWrap.style.alignItems = 'center';

                        const urlElement = document.createElement('p');
                        urlElement.className = 'item-meta';
                        urlElement.style.wordBreak = 'break-all';
                        urlElement.style.margin = '6px 0';
                        urlElement.textContent = url;

                        const openBtn = document.createElement('button');
                        openBtn.className = 'form-btn';
                        openBtn.style.marginTop = '8px';
                        openBtn.style.width = '220px';
                        openBtn.textContent = tableId === 'player' ? 'Abrir Reproductor' : 'Abrir en nueva pestaña';
                        openBtn.onclick = () => {
                            try {
                                // Abrir en nueva pestaña la URL del reproductor
                                window.open(url, '_blank');
                            } catch (e) {
                                // Fallback: navegar en la misma pestaña
                                window.location.href = url;
                            }
                        };

                        urlWrap.appendChild(urlElement);
                        urlWrap.appendChild(openBtn);
                        container.appendChild(urlWrap);
                    }
                } catch (err) {
                    console.warn('No se pudo construir la URL para la mesa:', err);
                }

                // Crear el botón para generar el QR
                const generateQrBtn = document.createElement('button');
                generateQrBtn.className = 'form-btn btn-generate-qr';
                generateQrBtn.textContent = 'Generar Código QR';
                generateQrBtn.onclick = () => {
                    generateQrBtn.style.display = 'none'; // Ocultar el botón
                    const canvas = document.createElement('canvas');
                    container.appendChild(canvas);
                    generateQrForTable(canvas, tableQrCode);
                };
                container.appendChild(generateQrBtn);

                // Solo mostrar botones de activar/desactivar si NO es el reproductor
                if (tableId !== 'player') {
                    // Crear el botón para activar/desactivar
                    const actionButton = document.createElement('button');
                    actionButton.className = `form-btn ${isActive ? 'btn-deactivate' : 'btn-activate'}`;
                    actionButton.textContent = isActive ? 'Desactivar Mesa' : 'Activar Mesa';
                    actionButton.dataset.tableId = tableId;
                    container.appendChild(actionButton);
                }
            }
            // --- PAGE LOADERS ---

            // Page loaders and account UI moved to modules:
            // - Dashboard: `static/admin_pages/dashboard.js` (loadDashboardPage, loadRecentOrders, reactions, broadcast)
            // - Accounts: `static/admin_pages/accounts.js` (loadAccountsPage, payment modal handlers)
            // The WebSocket handlers below will call these module functions when messages arrive.


            // WEBSOCKET: Conexión para actualizaciones en tiempo real (cola, notificaciones, consumos)
            let adminSocket = null;
            function setupAdminWebSocket() {
                try {
                    const wsScheme = window.location.protocol === 'https:' ? 'wss' : 'ws';
                    const wsUrl = `${wsScheme}://${window.location.host}/ws/cola`;
                    adminSocket = new WebSocket(wsUrl);

                    adminSocket.addEventListener('open', () => {
                        console.info('Admin websocket conectado');
                    });

                    adminSocket.addEventListener('message', (evt) => {
                        try {
                            const data = JSON.parse(evt.data);
                            if (!data || !data.type) return;
                            switch (data.type) {
                                case 'consumo_created':
                                    // Activar la alerta visual y sonora
                                    if (localStorage.getItem('adminSoundEnabled') !== 'false') {
                                        document.getElementById('order-notification-sound').play().catch(e => console.warn("No se pudo reproducir el sonido de notificación:", e));
                                    }
                                    // En lugar de añadirlo directamente, recargamos toda la lista para que se agrupe correctamente.
                                    loadRecentOrders();
                                    // Actualizar barra superior de pedidos
                                    loadTopOrdersBar();
                                    break;
                                case 'pedido_created':
                                    // Activar la alerta visual y sonora
                                    if (localStorage.getItem('adminSoundEnabled') !== 'false') {
                                        document.getElementById('order-notification-sound').play().catch(e => console.warn("No se pudo reproducir el sonido de notificación:", e));
                                    }

                                    const pedido = data.payload;
                                    const listElPedido = document.getElementById('recent-orders-list');
                                    if (listElPedido) {
                                        if (listElPedido.querySelector('p')) listElPedido.innerHTML = '';

                                        const li = document.createElement('li');
                                        li.className = 'item new-order';
                                        li.dataset.consumoIds = pedido.consumo_ids.join(','); // Guardamos todos los IDs

                                        const itemsHtml = pedido.items.map(item => `<li>${item.cantidad}x ${item.producto_nombre}</li>`).join('');
                                        const mesaText = pedido.mesa_nombre ? `Mesa ${pedido.mesa_nombre}` : '';

                                        li.innerHTML = `
                                        <div class="item-details">
                                            <div class="item-title">
                                                ${mesaText} pidió:
                                                <div class="tooltip-container">
                                                    <span class="tooltip-text">PEDIDO PENDIENTE POR DESPACHAR</span>
                                                    <span class="order-alert-icon shaking">🔔</span>
                                                </div>
                                            </div>
                                            <ul style="padding-left: 20px; margin: 5px 0; font-size: 0.95em;">${itemsHtml}</ul>
                                            <div class="item-meta">Por: ${pedido.usuario_nick} — ${new Date(pedido.created_at).toLocaleTimeString()}</div>
                                        </div>
                                        <div class="pending-dialog-container">
                                            <img src="/static/images/dialog_pending.png" alt="Pedido pendiente" class="pending-dialog-img">
                                        </div>
                                        <div class="item-actions">
                                            <button class="btn-despachado" data-ids="${pedido.consumo_ids.join(',')}" title="Marcar como despachado">Despachado</button>
                                            <button class="btn-no-despachado" data-ids="${pedido.consumo_ids.join(',')}" title="Cancelar pedido">No Despachado</button>
                                        </div>
                                    `;
                                        listElPedido.insertBefore(li, listElPedido.firstChild);
                                        while (listElPedido.children.length > 10) listElPedido.removeChild(listElPedido.lastChild);
                                    }
                                    // Actualizar barra superior de pedidos
                                    loadTopOrdersBar();
                                    break;
                                case 'consumo_deleted':
                                    // payload: {id: consumo_id} o {ids: [consumo_id1, ...]}
                                    const payload = data.payload;
                                    if (payload) {
                                        const listEl = document.getElementById('recent-orders-list');
                                        if (listEl) { // Check if the list element exists
                                            if (payload.id) { // Eliminar un solo consumo
                                                const child = listEl.querySelector(`li[data-consumo-id="${payload.id}"]`);
                                                if (child) child.remove();
                                            } else if (payload.ids && Array.isArray(payload.ids)) { // Eliminar un pedido consolidado
                                                // FIX: Ensure payload.ids is an array before joining.
                                                const orderId = Array.isArray(payload.ids) ? payload.ids.join(',') : '';
                                                const child = listEl.querySelector(`li[data-consumo-ids="${orderId}"], li[data-ids="${orderId}"]`);
                                                if (child) child.remove();
                                            }
                                        }
                                    }
                                    // Actualizar barra superior de pedidos
                                    loadTopOrdersBar();
                                    break;
                                case 'song_finished':
                                    const songInfo = data.payload;
                                    const lastSungContainer = document.getElementById('last-sung-info');
                                    if (lastSungContainer) {
                                        lastSungContainer.innerHTML = `
                                        <p style="font-size: 1.2em;"><strong>${songInfo.titulo}</strong></p>
                                        <p>Cantada por: <strong>${songInfo.usuario_nick}</strong></p>
                                        <p style="font-size: 1.5em; color: var(--secondary-color);">Puntaje: <strong>${songInfo.puntuacion_ia}</strong></p>
                                    `;
                                    }
                                    break;
                                case 'notification':
                                    showNotification(data.payload?.mensaje || 'Notificación', 'info');
                                    break;
                                case 'product_update':
                                    showNotification('El inventario de productos ha sido actualizado.', 'info');
                                    // Re-fetch products if inventory page is active
                                    if (document.getElementById('inventory').classList.contains('active')) {
                                        loadInventoryPage();
                                    }
                                    break;
                                case 'queue_update':
                                    // Almacenar el estado de la cola en la variable global
                                    // Esto permite actualizar la vista aunque no esté activa
                                    currentQueueData = data.payload || { now_playing: null, upcoming: [] };
                                    // Actualizar la lista si la pestaña de cola está visible
                                    if (document.getElementById('queue').classList.contains('active')) {
                                        const approvedListEl = document.getElementById('approved-songs-list');
                                        const lazySongsListEl = document.getElementById('lazy-songs-list');

                                        if (approvedListEl && typeof renderApprovedSongs === 'function') {
                                            renderApprovedSongs(currentQueueData, approvedListEl);
                                        }
                                        if (lazySongsListEl && typeof renderLazySongs === 'function' && currentQueueData.lazy_queue) {
                                            renderLazySongs(currentQueueData.lazy_queue, lazySongsListEl);
                                        }
                                    }
                                    break;
                                case 'reaction':
                                    const reactionPayload = data.payload;
                                    if (reactionPayload && reactionPayload.reaction) {
                                        const emoji = document.createElement('div');
                                        emoji.className = 'reaction-emoji';
                                        emoji.textContent = reactionPayload.reaction;

                                        // Posición horizontal aleatoria y animación
                                        emoji.style.left = `${Math.random() * 90 + 5}%`;
                                        emoji.style.setProperty('--tx', `${(Math.random() - 0.5) * 100}px`);

                                        document.getElementById('reaction-container').appendChild(emoji);
                                        setTimeout(() => emoji.remove(), 5000); // Limpiar después de la animación
                                    }
                                    break;
                                default:
                                    // Si el mensaje no tiene un 'type' conocido, podría ser la actualización de la cola.
                                    // Solo procesar si es un objeto con estructura de cola
                                    if (data.now_playing || data.upcoming) {
                                        const approvedListEl = document.getElementById('approved-songs-list');
                                        const lazySongsListEl = document.getElementById('lazy-songs-list');

                                        // Prefer module-managed render if available (queue.js defines renderApprovedSongs)
                                        if (typeof renderApprovedSongs === 'function') {
                                            try {
                                                renderApprovedSongs(data, approvedListEl);
                                                // Fix: Also render lazy songs if present in the payload
                                                if (data.lazy_queue || data.upcoming) {
                                                    // Assuming renderLazySongs is also global or we can access it
                                                    if (typeof renderLazySongs === 'function') {
                                                        renderLazySongs(data.lazy_queue || [], lazySongsListEl);
                                                    }
                                                }
                                            } catch (e) {
                                                console.error('Error in renderApprovedSongs:', e);
                                                // Fallback: ask the queue module to reload its data
                                                if (typeof loadQueuePage === 'function') loadQueuePage();
                                            }
                                        } else {
                                            // If module not loaded yet, trigger the queue page loader to ensure data/rendering
                                            if (typeof loadQueuePage === 'function') loadQueuePage();
                                        }
                                    }
                                    break;
                            }
                        } catch (err) {
                            console.error('Error procesando mensaje WS:', err);
                        }
                    });

                    adminSocket.addEventListener('close', () => {
                        console.warn('Admin websocket desconectado, reintentando en 3s...');
                        adminSocket = null;
                        setTimeout(setupAdminWebSocket, 3000);
                    });
                    adminSocket.addEventListener('error', (e) => {
                        console.error('WebSocket error', e);
                        try { adminSocket.close(); } catch (er) { }
                    });
                } catch (e) {
                    console.error('No se pudo establecer websocket:', e);
                }
            }

            // Page loaders for queue/inventory/settings/tables/reports moved to per-page modules:
            // - `static/admin_pages/queue.js` (loadQueuePage)
            // - `static/admin_pages/inventory.js` (loadInventoryPage)
            // - `static/admin_pages/settings.js` (loadSettingsPage)
            // - `static/admin_pages/tables.js` (loadTablesPage)
            // - `static/admin_pages/reports.js` (loadReportsPage)
            // The navigation handler calls those module functions via handleNavigation().

            // --- EVENT HANDLERS ---

            function handleNavigation(event) {
                event.preventDefault();
                const link = event.target.closest('.nav-link');
                if (!link) return;

                document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));

                link.classList.add('active');
                const pageId = link.getAttribute('href').substring(1);
                document.getElementById(pageId).classList.add('active');

                // Cargar datos y configurar listeners de la página activa
                switch (pageId) {
                    case 'dashboard':
                        loadDashboardPage();
                        setupDashboardListeners();
                        break;
                    case 'queue':
                        loadQueuePage();
                        setupQueueListeners();
                        break;
                    case 'inventory':
                        loadInventoryPage();
                        setupInventoryListeners();
                        break;
                    case 'settings':
                        // Ensure settings page is fully rendered before attaching listeners
                        loadSettingsPage().then(() => setupSettingsListeners());
                        break;
                    case 'accounts':
                        loadAccountsPage();
                        setupAccountsListeners();
                        break;
                    case 'reports':
                        loadReportsPage();
                        setupReportsListeners();
                        break;

                }
            }

            // Inventory, Tables, Settings, Accounts functions now in respective modules

            // Settings and API functions now in settings.js module

            // Broadcast and reset functions now in dashboard.js module

            // Autoplay toggle now in queue.js module

            // Queue/search logic (add song) moved to per-page module:
            // see `static/admin_pages/queue.js` -> `handleAdminAddSong` / `loadQueuePage`

            // handleQueueActions moved to the per-page module: static/admin_pages/queue.js

            function handleTableClickForQr(event) {
                const tableItem = event.target.closest('li.item');
                if (!tableItem) return;

                // Quitar la clase activa de otros elementos
                document.querySelectorAll('#tables-list li.item').forEach(li => li.classList.remove('active'));
                // Añadir clase activa al seleccionado
                tableItem.classList.add('active');

                const tableId = tableItem.dataset.tableId;
                const qrCode = tableItem.dataset.qrCode;
                const tableName = tableItem.dataset.tableName;
                const isActive = tableItem.dataset.isActive === 'true';

                showTableDetails(tableId, tableName, qrCode, isActive);
            }

            // Table activation handler moved to per-page module: static/admin_pages/tables.js -> handleToggleTableActive

            // --- NUEVA FUNCIÓN PARA ENVIAR REACCIONES ---
            // Reactions handler moved to per-page module: static/admin_pages/dashboard.js -> handleSendReaction

            function handleLogout() {
                sessionStorage.removeItem('adminApiKey');
                window.location.href = '/admin';
            }

            // --- MANEJO DE BARRA DE NAVEGACIÓN HORIZONTAL ---
            function setupTopNavigation() {
                const navItems = document.querySelectorAll('.admin-nav-item');
                navItems.forEach(item => {
                    item.addEventListener('click', (e) => {
                        const pageName = item.dataset.page;
                        if (pageName === undefined) return;

                        // Simular click en nav-link de antigua estructura
                        const navLink = document.querySelector(`.nav-link[href="#${pageName}"]`);
                        if (navLink) {
                            navLink.click();
                        }

                        // Actualizar estado activo en la barra superior
                        document.querySelectorAll('.admin-nav-item').forEach(n => n.classList.remove('active'));
                        item.classList.add('active');
                    });
                });

                // Manejo del botón logout superior
                const logoutBtnTop = document.getElementById('logout-btn-top');
                if (logoutBtnTop) {
                    logoutBtnTop.addEventListener('click', handleLogout);
                }
            }

            // --- MANEJO DE BARRA DE NAVEGACIÓN MÓVIL ---
            function setupMobileNavigation() {
                const navItems = document.querySelectorAll('.nav-item-admin');
                navItems.forEach(item => {
                    item.addEventListener('click', (e) => {
                        const pageName = item.dataset.page;
                        if (pageName === undefined) return;

                        // Crear un evento sintético para simular el click en el nav-link de sidebar
                        const navLink = document.querySelector(`.nav-link[href="#${pageName}"]`);
                        if (navLink) {
                            navLink.click();
                        }

                        // Actualizar estado activo en la barra móvil
                        document.querySelectorAll('.nav-item-admin').forEach(n => n.classList.remove('active'));
                        item.classList.add('active');
                    });
                });

                // Manejo del botón logout móvil
                const logoutBtnMobile = document.getElementById('logout-btn-mobile');
                if (logoutBtnMobile) {
                    logoutBtnMobile.addEventListener('click', handleLogout);
                }
            }

            // --- INITIALIZATION ---
            // Helpers to load per-page HTML fragments (module separation)
            function loadFragment(pageId) {
                const mapping = {
                    'dashboard': '/static/admin_pages/dashboard.html',
                    'queue': '/static/admin_pages/queue.html',
                    'inventory': '/static/admin_pages/inventory.html',

                    'accounts': '/static/admin_pages/accounts.html',
                    'reports': '/static/admin_pages/reports.html',
                    'settings': '/static/admin_pages/settings.html',
                    'player': '/static/admin_pages/player_dashboard_placeholder.html'
                };
                const url = mapping[pageId];
                if (!url) return Promise.resolve();
                return fetch(url, { cache: 'no-store' })
                    .then(r => { if (!r.ok) throw new Error('Fragment not found'); return r.text(); })
                    .then(html => { const el = document.getElementById(pageId); if (el) el.innerHTML = html; })
                    .catch(err => { console.warn('Failed to load fragment', pageId, err); });
            }

            function parseJwt(token) {
                try {
                    return JSON.parse(atob(token.split('.')[1]));
                } catch (e) {
                    return null;
                }
            }

            async function setupOwnerLocalSelector() {
                try {
                    const response = await fetch('/api/v1/saas/locales', {
                        headers: { 'Authorization': `Bearer ${apiKey}` }
                    });
                    if (!response.ok) throw new Error('Error al cargar locales');
                    const locales = await response.json();
                    
                    const container = document.getElementById('global-local-selector-container');
                    const select = document.getElementById('global-local-select');
                    
                    if (locales.length > 0 && container && select) {
                        select.innerHTML = '';
                        locales.forEach(local => {
                            const opt = document.createElement('option');
                            opt.value = local.id;
                            opt.textContent = local.nombre;
                            select.appendChild(opt);
                        });
                        
                        let savedLocalId = sessionStorage.getItem('active_local_id');
                        if (!savedLocalId || !locales.some(l => l.id == savedLocalId)) {
                            savedLocalId = locales[0].id;
                        }
                        sessionStorage.setItem('active_local_id', savedLocalId);
                        select.value = savedLocalId;
                        
                        container.style.display = 'flex';
                        
                        select.addEventListener('change', () => {
                            sessionStorage.setItem('active_local_id', select.value);
                            showNotification(`Establecimiento cambiado a: ${select.options[select.selectedIndex].text}`, 'info');
                            
                            const activePage = document.querySelector('.page.active');
                            if (activePage) {
                                const pageId = activePage.id;
                                if (pageId === 'inventory') {
                                    loadInventoryPage();
                                } else if (pageId === 'dashboard') {
                                    loadDashboardPage();
                                } else if (pageId === 'queue') {
                                    loadQueuePage();
                                } else if (pageId === 'accounts') {
                                    loadAccountsPage();
                                } else if (pageId === 'reports') {
                                    loadReportsPage();
                                } else if (pageId === 'settings') {
                                    loadSettingsPage();
                                }
                            }
                            loadTopOrdersBar();
                        });
                    }
                } catch (error) {
                    console.error('Error configurando selector de local:', error);
                }
            }

            function loadAllFragments() {
                return Promise.all(['dashboard', 'queue', 'inventory', 'accounts', 'reports', 'settings'].map(loadFragment));
            }
            window.addEventListener('DOMContentLoaded', () => {
                loadAllFragments().then(() => {
                    apiKey = sessionStorage.getItem('adminApiKey');
                    if (!apiKey) {
                        window.location.href = '/admin';
                        return;
                    }

                    // Inicializar local_id según rol
                    const payload = parseJwt(apiKey);
                    if (payload && payload.role === 'owner') {
                        setupOwnerLocalSelector();
                    } else if (payload && payload.local_id) {
                        sessionStorage.setItem('active_local_id', payload.local_id);
                    }

                    // Cargar datos de la página inicial
                    loadDashboardPage();


                    // Cargar pedidos en la barra superior
                    loadTopOrdersBar();
                    setupTopOrdersListeners(); // Attach listeners separately

                    // Setup toggle para barra de pedidos
                    setupOrdersBarToggle();

                    // Setup WebSocket for realtime updates (consume events and others)
                    setupAdminWebSocket();

                    // Setup top navigation
                    setupTopNavigation();

                    // Setup mobile navigation
                    setupMobileNavigation();

                    // Event Listeners - Global only
                    document.querySelector('.nav-menu').addEventListener('click', handleNavigation);
                    const logoutBtnLegacy = document.getElementById('logout-btn');
                    if (logoutBtnLegacy) {
                        logoutBtnLegacy.addEventListener('click', handleLogout);
                    }

                    // Page modules handle their own event listeners via setupXxxListeners()
                    // Called automatically when pages load via handleNavigation()
                    setupDashboardListeners(); // Setup initial page listeners

                }).catch(err => { console.warn('Error loading fragments', err); apiKey = sessionStorage.getItem('adminApiKey'); if (!apiKey) { window.location.href = '/admin'; return; } loadDashboardPage(); setupAdminWebSocket(); startCarousel(); });
            });
        </script>
</body>
